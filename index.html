<style>
:root {
  --bg: #000000;
  --card-bg: rgba(28, 28, 30, 0.75);
  --card-hover: rgba(44, 44, 46, 0.85);
  --border: rgba(255, 255, 255, 0.1);
  --text: #f5f5f7;
  --text-sub: #ebebf599;
  --accent: #0a84ff;
  --green: #30d158;
  --orange: #ff9f0a;
  --radius: 20px;
}

[data-theme="light"] {
  --bg: #f2f2f7;
  --card-bg: rgba(255, 255, 255, 0.85);
  --card-hover: rgba(255, 255, 255, 1);
  --border: rgba(0, 0, 0, 0.08);
  --text: #000000;
  --text-sub: #3c3c4399;
  --accent: #007aff;
  --green: #34c759;
  --orange: #ff9500;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); scroll-behavior: smooth; }
body {
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button, input { font-family: inherit; border: none; outline: none; background: none; color: inherit; }

/* APP WRAPPER */
.store-container {
  max-width: 520px; margin: 0 auto;
  padding: calc(16px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom));
}

/* NAVBAR */
.store-nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; margin-bottom: 16px; border-radius: var(--radius);
  background: var(--card-bg); border: 1px solid var(--border);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  position: sticky; top: calc(8px + env(safe-area-inset-top)); z-index: 50;
}
.nav-brand { display: flex; align-items: center; gap: 10px; }
.nav-avatar { width: 36px; height: 36px; border-radius: 50%; overflow: hidden; border: 1px solid var(--border); }
.nav-avatar img { width: 100%; height: 100%; object-fit: cover; }
.nav-title { font-size: 15px; font-weight: 800; letter-spacing: -0.2px; }
.nav-sub { font-size: 11px; color: var(--text-sub); font-weight: 600; }

.nav-actions { display: flex; align-items: center; gap: 8px; }
.nav-btn {
  height: 32px; padding: 0 12px; border-radius: 99px;
  background: rgba(255,255,255,0.08); border: 1px solid var(--border);
  font-size: 11.5px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 5px;
}
.nav-btn.playing { background: rgba(10, 132, 255, 0.2); color: var(--accent); border-color: var(--accent); }

/* STATUS BANNER */
.status-banner {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; margin-bottom: 16px; border-radius: var(--radius);
  background: rgba(48, 209, 88, 0.12); border: 1px solid rgba(48, 209, 88, 0.3);
  font-size: 12px; font-weight: 700; color: var(--green);
}
.status-btn {
  padding: 5px 12px; border-radius: 99px; background: var(--green); color: #000;
  font-size: 11px; font-weight: 800; cursor: pointer;
}

/* SEARCH BAR */
.search-box {
  display: flex; align-items: center; gap: 10px;
  height: 46px; padding: 0 14px; border-radius: 14px;
  background: var(--card-bg); border: 1px solid var(--border);
  margin-bottom: 16px; backdrop-filter: blur(10px);
}
.search-box input { flex: 1; font-size: 13px; font-weight: 600; }

/* CATEGORY PILLS */
.filter-scroll {
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-bottom: 20px;
}
.filter-scroll::-webkit-scrollbar { display: none; }
.f-pill {
  flex-shrink: 0; padding: 8px 14px; border-radius: 99px;
  background: var(--card-bg); border: 1px solid var(--border);
  font-size: 12px; font-weight: 700; color: var(--text-sub); cursor: pointer;
  transition: 0.2s;
}
.f-pill.active { background: var(--text); color: var(--bg); border-color: transparent; }

/* SECTION & APP LIST */
.section-block { margin-bottom: 24px; }
.section-header { font-size: 18px; font-weight: 800; margin-bottom: 12px; letter-spacing: -0.3px; }

.app-list { display: flex; flex-direction: column; gap: 10px; }
.app-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-radius: var(--radius);
  background: var(--card-bg); border: 1px solid var(--border);
  cursor: pointer; transition: 0.2s;
}
.app-row:hover { background: var(--card-hover); transform: translateY(-1px); }

.app-img { width: 56px; height: 56px; border-radius: 14px; overflow: hidden; border: 1px solid var(--border); flex-shrink: 0; background: #222; }
.app-img img { width: 100%; height: 100%; object-fit: cover; }
.app-info { flex: 1; min-width: 0; }
.app-name { font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.app-desc { font-size: 11.5px; color: var(--text-sub); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.app-tags { display: flex; gap: 5px; margin-top: 6px; }
.tag { font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 4px; }
.t-blue { background: rgba(10,132,255,0.15); color: var(--accent); }
.t-orange { background: rgba(255,159,10,0.15); color: var(--orange); }

.get-action {
  padding: 7px 16px; border-radius: 99px;
  background: rgba(255,255,255,0.1); color: var(--accent);
  font-size: 12px; font-weight: 800; flex-shrink: 0;
}
.app-row:hover .get-action { background: var(--accent); color: #fff; }

/* MODAL SHEET */
.modal-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(10px);
  display: none; align-items: flex-end; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal-sheet {
  width: 100%; max-width: 520px; max-height: 85vh; overflow-y: auto;
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: 28px 28px 0 0; padding: 20px 20px calc(24px + env(safe-area-inset-bottom));
}
.sheet-top { display: flex; gap: 14px; align-items: center; margin-bottom: 16px; }
.sheet-icon { width: 68px; height: 68px; border-radius: 16px; overflow: hidden; }
.sheet-icon img { width: 100%; height: 100%; object-fit: cover; }
.sheet-title { font-size: 18px; font-weight: 800; }
.sheet-desc { font-size: 12px; color: var(--text-sub); margin-top: 4px; }

.sheet-btn {
  width: 100%; height: 48px; border-radius: 14px; background: var(--accent); color: #fff;
  font-size: 14px; font-weight: 800; display: grid; place-items: center; cursor: pointer; margin-top: 16px;
}

/* FLOATING DOCK BOTTOM */
.bottom-dock {
  position: fixed; bottom: calc(10px + env(safe-area-inset-bottom)); left: 50%;
  transform: translateX(-50%); width: min(94vw, 480px);
  padding: 6px; border-radius: 24px; z-index: 100;
  background: var(--card-bg); border: 1px solid var(--border);
  backdrop-filter: blur(20px); display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px;
}
.dock-item {
  padding: 6px 2px; border-radius: 16px; display: flex; flex-direction: column;
  align-items: center; gap: 2px; font-size: 9px; font-weight: 700; color: var(--text-sub); cursor: pointer;
}
.dock-item span:first-child { font-size: 16px; }
.dock-item.active { background: rgba(255,255,255,0.12); color: var(--text); }

.toast {
  position: fixed; top: 16px; left: 50%; transform: translate(-50%, -20px); opacity: 0; pointer-events: none;
  padding: 10px 18px; border-radius: 99px; background: #fff; color: #000; font-size: 12px; font-weight: 800; z-index: 300; transition: 0.2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>

const CAT_TITLES = {
  ipa: "📱 Kho IPA VIP",
  bypass: "🛡️ File Bypass & DNS",
  lq: "⚔️ Liên Quân Mobile",
  ff: "🔥 Free Fire Max",
  pubg: "🎯 PUBG Mobile",
  other: "🎬 Game Khác & CapCut"
};

let activeCat = "all";

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2000);
}

function renderStore() {
  const kw = document.getElementById("searchInput").value.toLowerCase();
  const container = document.getElementById("storeContent");
  container.innerHTML = "";

  const cats = activeCat === "all" ? Object.keys(CAT_TITLES) : [activeCat];
  let total = 0;

  cats.forEach(cat => {
    let items = APPS.filter(a => a.cat === cat && (!kw || (a.title + " " + a.desc).toLowerCase().includes(kw)));
    if (items.length) {
      total += items.length;
      const block = document.createElement("div");
      block.className = "section-block";
      block.innerHTML = `
        <div class="section-header">${CAT_TITLES[cat]}</div>
        <div class="app-list">
          ${items.map(a => `
            <div class="app-row" onclick="openAppModal('${a.id}')">
              <div class="app-img">
                <img src="${REPO + a.icon}" alt="${a.title}" loading="lazy" onerror="this.style.display='none'">
              </div>
              <div class="app-info">
                <div class="app-name">${a.title}</div>
                <div class="app-desc">${a.desc}</div>
                <div class="app-tags"><span class="tag t-blue">iOS No-JB</span></div>
              </div>
              <div class="get-action">NHẬN</div>
            </div>
          `).join("")}
        </div>
      `;
      container.appendChild(block);
    }
  });
}

function setCategory(cat) {
  activeCat = cat;
  document.querySelectorAll(".f-pill, .dock-item").forEach(el => {
    el.classList.toggle("active", el.dataset.cat === cat);
  });
  renderStore();
}

document.querySelectorAll(".f-pill").forEach(p => {
  p.addEventListener("click", () => setCategory(p.dataset.cat));
});

document.getElementById("searchInput").addEventListener("input", renderStore);

function openAppModal(id) {
  const app = APPS.find(a => a.id === id);
  if (!app) return;
  document.getElementById("mIcon").src = REPO + app.icon;
  document.getElementById("mTitle").textContent = app.title;
  document.getElementById("mDesc").textContent = app.desc;
  document.getElementById("mDownloadBtn").href = app.href;
  document.getElementById("appModal").classList.add("show");
}

function closeAppModal() {
  document.getElementById("appModal").classList.remove("show");
}

  yt = new YT.Player("youtubePlayer", {
    height: "1", width: "1", videoId: "BUORWKzSl_o",
    playerVars: { autoplay: 0, controls: 0, playsinline: 1 },
    events: { onReady: () => { ytReady = true; yt.setVolume(65); } }
  });
};

document.getElementById("audioToggleBtn").addEventListener("click", () => {
  if (!yt || !ytReady) { showToast("⏳ Đang tải nhạc..."); return; }
  if (isPlaying) {
    yt.pauseVideo(); isPlaying = false;
    document.getElementById("audioToggleBtn").classList.remove("playing");
    document.getElementById("audioLabel").textContent = "Nhạc";
  } else {
    yt.playVideo(); isPlaying = true;
    document.getElementById("audioToggleBtn").classList.add("playing");
    document.getElementById("audioLabel").textContent = "Đang phát";
    showToast("🎵 Đang phát nhạc nền");
  }
});

/* THEME */
const themeBtn = document.getElementById("themeToggleBtn");
const savedTheme = localStorage.getItem("mgi_theme") || "dark";
document.documentElement.setAttribute("data-theme", savedTheme);
themeBtn.textContent = savedTheme === "dark" ? "☀️" : "🌙";

themeBtn.addEventListener("click", () => {
  const dark = document.documentElement.getAttribute("data-theme") === "dark";
  const next = dark ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("mgi_theme", next);
  themeBtn.textContent = next === "dark" ? "☀️" : "🌙";
});

renderStore();
</script>
</body>
</html>
